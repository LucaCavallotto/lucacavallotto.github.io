<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Subtle shadow for depth -->
  <circle cx="256" cy="258" r="240" fill="#000000" opacity="0.04" />
  <!-- White Circular Background -->
  <circle cx="256" cy="256" r="240" fill="#ffffff" stroke="#f0f0f0" stroke-width="4" />
  <!-- Solid Black Monogram LC -->
  <text x="256" y="270" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-weight="800" 
        font-size="190" 
        fill="#0a0a0a" 
        text-anchor="middle" 
        dominant-baseline="middle" 
        letter-spacing="-6">LC</text>
</svg>
